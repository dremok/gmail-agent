name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Tag, pyproject, server.json and mcp-name agree
        run: |
          v="${GITHUB_REF_NAME#v}"
          test "$(uv version --short)" = "$v"
          test "$(jq -r .version server.json)" = "$v"
          test "$(jq -r '.packages[0].version' server.json)" = "$v"
          test "$(jq -r .version .claude-plugin/plugin.json)" = "$v"
          test "$(jq -r '.mcpServers.gmail.args[0]' .claude-plugin/plugin.json)" = "gmail-agent==$v"
          grep -q 'mcp-name: io.github.dremok/gmail-agent' README.md
      - name: CHANGELOG has notes for this version
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 == "## " v {on=1; next} on && /^## / {exit} on' CHANGELOG.md | grep -q '[^[:space:]]'
      - run: uv build
      - name: Smoke test wheel
        run: uv run --isolated --no-project --with dist/*.whl gmail-agent --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gmail-agent
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The registry validator fetches exactly this URL; its source explicitly handles
      # "freshly published release has not yet propagated", so wait for it here.
      - name: Wait until PyPI serves this version
        run: |
          v="${GITHUB_REF_NAME#v}"
          for i in $(seq 30); do
            curl -fsS "https://pypi.org/pypi/gmail-agent/$v/json" >/dev/null && exit 0
            sleep 10
          done
          exit 1
      - name: Install mcp-publisher
        run: curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: GitHub release with this version's CHANGELOG section as notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 == "## " v {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
