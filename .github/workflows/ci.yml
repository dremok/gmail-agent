name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  intel-mac:
    # cryptography ships arm64-only macOS wheels from 49 on; Intel Macs must still get a wheel,
    # both from uv.lock and when installed the way users do (uvx).
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --no-build-package cryptography
      - run: uv run pytest
      - run: uvx --isolated --no-build-package cryptography --from . gmail-agent --version
