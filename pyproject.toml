[project]
name = "gmail-agent"
version = "0.2.0"
description = "Gmail for AI agents: search, read, download attachments, send, reply, forward, drafts and labels, as a CLI and an MCP server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Max Leander" }]
requires-python = ">=3.11"
keywords = ["gmail", "mcp", "mcp-server", "ai-agents", "claude", "cli", "attachments"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
]
dependencies = [
    "google-api-python-client==2.201.0",
    "google-auth==2.60.0",
    "google-auth-httplib2==0.4.4",
    "google-auth-oauthlib==1.5.0",
    "mcp==2.3.0",
    "pypdf==6.19.0",
]

[project.urls]
Homepage = "https://github.com/dremok/gmail-agent"
Issues = "https://github.com/dremok/gmail-agent/issues"

[project.scripts]
gmail-agent = "gmail_agent.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gmail_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
